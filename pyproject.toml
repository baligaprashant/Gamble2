[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamble2"
version = "0.1.0"
description = "Live Texas Hold'em heads-up equity from camera or screen"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "mss>=9.0",
  "treys>=0.1.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gamble2 = "gamble2.main:main"
gamble2-build-tables = "gamble2.odds.build_tables:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gamble2 = ["data/*.json", "data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
